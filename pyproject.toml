[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factorgcl"
version = "0.1.0"
description = "FactorGCL: a hypergraph-based factor model with temporal residual contrastive learning for stock returns prediction (AAAI-25)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "torch>=1.8",
]

[project.optional-dependencies]
data = ["pandas>=1.3", "scipy>=1.7"]
dev = ["pytest>=7.0", "pandas>=1.3", "scipy>=1.7"]

[tool.setuptools.packages.find]
include = ["factorgcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
